name: fitactive-ecommerce-prod

# Start with: podman compose -f docker-compose.prod.yml up --build -d
# Backend startup applies pending migrations to the database in the root .env.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "4000"
    volumes:
      - product-uploads:/app/uploads
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DIRECT_URL: ${DIRECT_URL:?DIRECT_URL is required}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
      SEED_ON_START: ${SEED_ON_START:-false}
      EXTERNAL_BAAS_URL: ${EXTERNAL_BAAS_URL:-https://core.geozns.com}
      EXTERNAL_BAAS_API_KEY: ${EXTERNAL_BAAS_API_KEY:?EXTERNAL_BAAS_API_KEY is required}
      JWT_APP_ID: ${JWT_APP_ID:-integrador2_web}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      INVENTORY_EMAIL: ${INVENTORY_EMAIL:?INVENTORY_EMAIL is required}
      INVENTORY_PASSWORD: ${INVENTORY_PASSWORD:?INVENTORY_PASSWORD is required}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:?MP_ACCESS_TOKEN is required}
      MP_CURRENCY_ID: ${MP_CURRENCY_ID:-PEN}
      MP_TEST_BUYER_EMAIL: ${MP_TEST_BUYER_EMAIL:-}
      APP_URL: ${APP_URL:?APP_URL is required}
      MP_WEBHOOK_URL: ${MP_WEBHOOK_URL:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?VITE_GOOGLE_CLIENT_ID is required}
        VITE_BAAS_WS_URL: ${VITE_BAAS_WS_URL:-wss://core.geozns.com/v1/ws}
        VITE_JWT_APP_ID: ${VITE_JWT_APP_ID:-integrador2_web}
        VITE_MP_PUBLIC_KEY: ${VITE_MP_PUBLIC_KEY:?VITE_MP_PUBLIC_KEY is required}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  product-uploads:
